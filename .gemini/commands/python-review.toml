description = "Comprehensive Python code review for PEP 8 compliance, type hints, security, and Pythonic idioms. Invokes the python-reviewer agent."

prompt = """
Comprehensive Python-specific code review.

## Python Changes
!{git diff --name-only HEAD | grep "\\\\.py$"}

## Review Categories
1. **Identify Python Changes**: Find modified `.py` files.
2. **Security Scan**: Check for SQL injection, command injection, unsafe deserialization.
3. **Type Safety Review**: Analyze type hints and mypy errors.
4. **Pythonic Code Check**: Verify code follows PEP 8 and Python best practices.

This command invokes the **python-reviewer** agent.

Arguments: {{args}}
"""
